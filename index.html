<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>.˖.⋆｡˚⋆⋆｡ﾟ｡⋆｡ﾟ☾</title>
  <link rel="icon" href="https://github.com/unflowered/unflowered/blob/main/img/mark.jpg?raw=true" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="board">
    <div id="nav-slot" style="display: contents;"></div>

    <div class="gallery">
      <figure id="img1">
        <a href="https://www.youtube.com/watch?v=OjsDLvybaM0" target="_blank">
          <img src="https://github.com/unflowered/unflowered/blob/main/img/angel.jpg?raw=true">
        </a>
      </figure>
    </div>
  </div>

  <script>
    // animated tab title
    const base = ".˖｡˚⋆⋆｡ﾟ｡⋆｡ﾟ☾";
    let current = base;
    setInterval(() => {
      current = current.slice(-1) + current.slice(0, -1);
      document.title = current;
    }, 250);

    // so it doesnt make a new page when you click the links
    function toggleAbout() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links a:not(#about)').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('about-section').classList.toggle('visible');
    }
    function toggleRoblox() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links > a:not(#roblox)').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('roblox-section').classList.toggle('visible');
    }
    function toggleEvents() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links > a:not(#events)').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('events-section').classList.toggle('visible');
    }

    // scatters buttons across the page
    function scatterLinks() {
      const links = document.querySelectorAll('#twitter, #instagram, #steam, #spotify, #roblox, #youtube, #soundcloud, #twitch, #events');
      const cols = 4;
      const rows = 3;
      const cellWidth = 90 / cols;
      const cellHeight = 90 / rows;

      const cells = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          cells.push({ row: r, col: c });
        }
      }
      cells.sort(() => Math.random() - 0.5);

      links.forEach((link, i) => {
        const cell = cells[i];
        const top = cell.row * cellHeight + Math.random() * (cellHeight * 0.5);
        const left = cell.col * cellWidth + Math.random() * (cellWidth * 0.5);
        link.style.top = `${top}%`;
        link.style.left = `${left}%`;
      });
    }

    // concert tab has a lot of content, pulls from events.json
    function loadEvents() {
      fetch('events.json')
        .then(res => res.json())
        .then(events => {
          const list = document.getElementById('events-list');
          list.innerHTML = events.map(e => `
            <li class="entry">
              <div class="entry-top">
                <span class="entry-name">${e.name}</span>
                <span class="entry-date">${e.date}</span>
              </div>
              <div class="entry-sub">
                <span class="entry-type type-${e.type}">${e.type}</span>
                <span class="entry-location">${e.location}</span>
              </div>
              <div class="entry-notes">${e.notes}</div>
            </li>
          `).join('');
        })
        .catch(err => console.error('couldnt load events.json:', err));
    }

    // same concept as the concert tab, pulls from nav.html
    fetch('nav.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-slot').innerHTML = html;
        scatterLinks();
        loadEvents();
      })
      .catch(err => console.error('couldnt load nav.html:', err));
  </script>
</body>
</html>
