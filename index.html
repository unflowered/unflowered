<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.˖.⋆｡˚⋆⋆｡ﾟ｡⋆｡ﾟ☾</title>
  <link rel="icon" href="https://github.com/unflowered/unflowered/blob/main/img/mark.jpg?raw=true" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="board">
    <div id="nav-slot" style="display: contents;"></div>

    <div class="gallery">
      <figure id="img1">
        <a href="https://www.youtube.com/watch?v=OjsDLvybaM0" target="_blank">
          <img src="https://github.com/unflowered/unflowered/blob/main/img/angel.jpg?raw=true">
        </a>
      </figure>
    </div>
  </div>

  <script>
    // animated tab title
    const base = ".˖｡˚⋆⋆｡ﾟ｡⋆｡ﾟ☾";
    let current = base;
    setInterval(() => {
      current = current.slice(-1) + current.slice(0, -1);
      document.title = current;
    }, 250);

    // so it doesnt make a new page when you click the links
    function toggleAbout() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links > a').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('about-section').classList.toggle('visible');
    }
    function toggleRoblox() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links > a').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('roblox-section').classList.toggle('visible');
    }
    function toggleEvents() {
      document.querySelector('.gallery').classList.toggle('hidden');
      document.querySelectorAll('.links > a').forEach(el => el.classList.toggle('hidden'));
      document.getElementById('events-section').classList.toggle('visible');
    }

    // scatters buttons across the page without letting any of them overlap
    function scatterLinks() {
      const container = document.querySelector('.links');
      const links = [...document.querySelectorAll('#twitter, #instagram, #steam, #spotify, #roblox, #youtube, #soundcloud, #twitch, #events')];
      const fixed = [...document.querySelectorAll('#title, #about')];
      const W = container.clientWidth;
      const H = container.clientHeight;
      const gap = 12; // minimum space between any two links, in px

      const box = el => ({ x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });
      const overlaps = (a, b) =>
        a.x < b.x + b.w + gap && b.x < a.x + a.w + gap &&
        a.y < b.y + b.h + gap && b.y < a.y + a.h + gap;

      // try a few full layouts, keep the first one where nothing touches
      let best = null;
      for (let attempt = 0; attempt < 50 && !best; attempt++) {
        const placed = fixed.map(box);
        const spots = [];
        let ok = true;

        for (const link of links) {
          const w = link.offsetWidth;
          const h = link.offsetHeight;
          let spot = null;
          for (let tries = 0; tries < 300; tries++) {
            const s = { x: Math.random() * Math.max(0, W - w), y: Math.random() * Math.max(0, H - h), w, h };
            if (!placed.some(p => overlaps(s, p))) { spot = s; break; }
          }
          if (!spot) { ok = false; break; }
          placed.push(spot);
          spots.push(spot);
        }
        if (ok) best = spots;
      }
      if (!best) return; // screen too small to fit everything apart, keep the old layout

      links.forEach((link, i) => {
        link.style.left = `${best[i].x / W * 100}%`;
        link.style.top = `${best[i].y / H * 100}%`;
      });
    }

    // rescatter if the window width changes so links dont collide after resizing
    let lastWidth = window.innerWidth;
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth === lastWidth) return;
        if (document.querySelector('.about-section.visible')) return;
        lastWidth = window.innerWidth;
        scatterLinks();
      }, 200);
    });

    // concert tab has a lot of content, pulls from events.json
    function loadEvents() {
      fetch('events.json')
        .then(res => res.json())
        .then(events => {
          const list = document.getElementById('events-list');
          list.innerHTML = events.map(e => `
            <li class="entry">
              <div class="entry-top">
                <span class="entry-name">${e.name}</span>
                <span class="entry-date">${e.date}</span>
              </div>
              <div class="entry-sub">
                <span class="entry-type type-${e.type}">${e.type}</span>
                <span class="entry-location">${e.location}</span>
              </div>
              <div class="entry-notes">${e.notes}</div>
            </li>
          `).join('');
        })
        .catch(err => console.error('couldnt load events.json:', err));
    }

    // same concept as the concert tab, pulls from nav.html
    fetch('nav.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('nav-slot').innerHTML = html;
        scatterLinks();
        loadEvents();
      })
      .catch(err => console.error('couldnt load nav.html:', err));
  </script>
</body>
</html>
